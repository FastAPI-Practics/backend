stages:
- release
- deploy

cache:
  key: $CI_COMMIT_REF_SLUG
  paths:
    - ~/.npm/

create_tag:
  image: node:latest
  stage: release
  script:
    - npm i @semantic-release/gitlab
    - npx semantic-release
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - when: always

test_ansible:
  image: lamarr3/ansible-setup:1.0.1
  stage: deploy
  before_script:
  - mkdir -p ~/.ssh
  - touch ~/.ssh/id_ed25519
  - eval "$(ssh-agent -s)"
  - cat $SSH_PRIVATE_KEY_B64 | base64 -d | tr -d '\r' > ~/.ssh/id_ed25519
  - chmod 700 ~/.ssh/id_ed25519
  - cp $SSH_KNOWN_HOSTS ~/.ssh/known_hosts
  - mkdir -p /etc/ansible
  - echo -e "[vms]\n$VM_HOST" > /etc/ansible/hosts
  script:
  - ansible-playbook ansible/playbooks/test-playbook.yaml -u $VM_USER
  rules:
  - if: '$CI_COMMIT_TAG'
  after_script:
  - rm -rf ~/.ssh
  - rm -rf /etc/ansible
