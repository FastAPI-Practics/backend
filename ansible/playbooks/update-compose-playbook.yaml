- name: Update compose
  hosts: vms
  become: true
  vars:
    env_path: "{{ lookup('env', 'ENV', default='../../src/.env') }}"
    back_image: "{{ lookup('env', 'DOCKER_IMAGE_WITH_TAG') }}"
    front_image: nginx:stable-alpine
    server_name: "{{ lookup('env', 'DOMAIN', default='localhost') }}"
    compose_path: ./compose.yaml
  tasks:
    - name: Copy .env file
      ansible.builtin.copy:
        src: "{{ env_path }}"
        dest: ./.env
        mode: preserve

    - name: Creates nginx directory
      ansible.builtin.file:
        path: ./nginx
        state: directory
        owner: root
        group: root
        mode: '444'

    - name: Template nginx config
      ansible.builtin.template:
        src: ../nginx.conf.j2
        dest: ./nginx/nginx.conf
        mode: preserve

    - name: Check if compose file exists
      ansible.builtin.stat:
        path: "{{ compose_path }}"
      register: file_data

    - name: Stop running containers
      community.docker.docker_compose_v2:
        project_src: .
        state: absent
        remove_orphans: true
      when: file_data.stat.exists

    - name: Read compose
      ansible.builtin.slurp:
        src: "{{ compose_path }}"
      register: yaml_data
      when: file_data.stat.exists

    - name: Parse the data
      ansible.builtin.set_fact:
        compose_data: "{{ yaml_data.content | b64decode | from_yaml }}"
      when: file_data.stat.exists

    - name: Extract frontend image
      ansible.builtin.set_fact:
        front_image: "{{ compose_data['x-front-image'] }}"
      when: file_data.stat.exists

    - name: Template a docker-compose
      ansible.builtin.template:
        src: ../compose.j2
        dest: "{{ compose_path }}"
        mode: preserve

    - name: Start compose
      community.docker.docker_compose_v2:
        project_src: .
        state: present

    - name: Prune all unused images
      community.docker.docker_prune:
        images: true
        images_filters:
          dangling: false
