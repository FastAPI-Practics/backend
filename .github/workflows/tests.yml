name: Run tests

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'
    - name: Install uv
      uses: astral-sh/setup-uv@v5
    - name: Prepare DB
      run: |
        cd src
        uv sync
        touch db.sqlite3
        uv run python3 test_db_init.py 2> /dev/null
        uv run python3 test_db_init.py
    
    - name: Run tests
      run: |
        cd src
        uv run -m pytest --junitxml=pytest.xml --cov-report=term-missing --cov=src tests/ | tee pytest-coverage.txt

    - name: Coverage comment
      id: coverage
      uses: MishaKav/pytest-coverage-comment@v1
      with:
        pytest-coverage-path: ./pytest-coverage.txt
        junitxml-path: ./pytest.xml
        hide-comment: true