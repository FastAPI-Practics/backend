name: Release app

on:
  push:
    branches:
      - main
      - ci-cd-2

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      new_release_version: ${{ steps.semantic_release.outputs.new_release_version }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Nodejs
      uses: actions/setup-node@v4
      with:
        node-version: "lts/*"
    
    - name: Run semantic-release
      id: semantic_release
      uses: cycjimmy/semantic-release-action@v6
      env:
        GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
  deploy:
    runs-on: ubuntu-latest
    needs: release
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    
    - name: Install Ansible
      run: pipx install --include-deps ansible
    
    - name: Install Ansible collections
      run: ansible-galaxy collection install -r requirements.yml
    
    - name: Set up SSH
      shell: bash
      run: |
        eval `ssh-agent -s`
        mkdir -p ~/.ssh/
        touch ~/.ssh/id_ed25519
        echo -e "${{ secrets.SSH_PRIVATE_KEY_B64 }}" | base64 -d | tr -d '\r' > ~/.ssh/id_ed25519
        chmod 700 ~/.ssh/id_ed25519
        echo -e "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts

    - name: Create inventory
      run: |
        cat > ansible/inventory.ini << EOF
        [vms]
        ${{ secrets.VM_HOST }}
        EOF

    - name: Run playbook
      run: |
        cd ansible
        ansible-playbook \
          -i inventory.ini \
          -u ${{ secrets.VM_USER }} \
          playbooks/test-playbook.yaml
      env:
        ANSIBLE_HOST_KEY_CHECKING: "false"
        ANSIBLE_FORCE_COLOR: "true"
