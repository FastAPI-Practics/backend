name: fastapi-compose

x-back-image: &back-image lamarr3/simple-fastapi
x-front-image: &front-image nginx:stable-alpine

x-base: &base
  image: *back-image
  env_file:
    - .env
  environment:
    DB__HOST: db

services:
  db:
    image: postgres:18
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB__USER}
      POSTGRES_PASSWORD: ${DB__PASSWORD}
      POSTGRES_DB: ${DB__NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  alembic:
    <<: *base
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
  rbac:
    <<: *base
    restart: on-failure
    depends_on:
      alembic:
        condition: service_completed_successfully
    command: ["python3", "init.py"]
  api:
    <<: *base
    depends_on:
      rbac:
        condition: service_completed_successfully
    restart: always
    ports:
      - 8000:8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  web:
    image: *front-image
    restart: always
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./html:/var/www/html:ro
    depends_on:
      api:
        condition: service_healthy
  
  proxy:
    image: 'jc21/nginx-proxy-manager:latest'
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '81:81'
    env_file:
    - .env
    environment:
      TZ: "Russia/Moscow"
      DB_POSTGRES_HOST: 'db'
      DB_POSTGRES_PORT: '5432'
      DB_POSTGRES_USER: ${DB__USER}
      DB_POSTGRES_PASSWORD: ${DB__PASSWORD}
      DB_POSTGRES_NAME: ${DB__NAME}
      INITIAL_ADMIN_EMAIL: ${PROXY__ADMIN_EMAIL}
      INITIAL_ADMIN_PASSWORD: ${PROXY__ADMIN_PASSWORD}
    volumes:
      - proxy_data:/data
      - certificates:/etc/letsencrypt

volumes:
  pgdata:
  proxy_data:
  certificates: